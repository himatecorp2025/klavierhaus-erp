name: Klavierhaus ERP Round 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  round1-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
      - name: Validate package manifests
        run: npm run check:manifests
      - name: Install locked dependencies
        run: npm ci
      - name: Verify protected public assets
        run: |
          npm run check:assets
          npm run check:assets:http
      - name: Run Round 1 migration smoke
        run: npm run check:migration
      - name: Check active JavaScript and schema
        run: npm run check
      - name: Run Round 1 tests
        run: npm test
      - name: Report baseline production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  public-website-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert website directory is untouched
        run: |
          git fetch origin develop --depth=1
          git diff --exit-code origin/develop -- .
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci
      - name: Check website JavaScript syntax
        run: npm run check
      - name: Run preserved public event-page contract
        run: node --test test/event-pages.test.js
      - name: Report immutable website dependency baseline
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
