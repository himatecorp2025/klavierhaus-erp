name: Klavierhaus ERP Final Compliance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  final-compliance-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
      - name: Validate package manifests
        run: npm run check:manifests
      - name: Install locked dependencies
        run: npm ci
      - name: Verify protected public assets
        run: |
          npm run check:assets
          npm run check:assets:http
      - name: Run migration smoke
        run: npm run check:migration
      - name: Check active JavaScript and schema
        run: npm run check
      - name: Run final acceptance suite five times
        run: |
          for run in 1 2 3 4 5; do
            echo "Acceptance run ${run}/5"
            npm test
          done
      - name: Report baseline production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  public-website-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert website changes stay inside the approved public-website scope
        run: |
          git fetch origin develop --depth=1
          changed="$(git diff --name-only origin/develop -- .)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(website/server/index\.js|website/server/site-content\.js|website/server/event-client\.js|website/server/erp-client\.js|website/public/app\.js|website/public/styles\.css|website/package\.json|website/test/website-foundation\.test\.js|website/test/event-pages\.test\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected website changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci
      - name: Check website JavaScript syntax
        run: npm run check
      - name: Run public event-retirement contract
        run: node --test --test-name-pattern="retired event and ticket URLs" test/website-foundation.test.js
      - name: Run private appointment website contract
        run: node --test --test-name-pattern="private appointment forms" test/website-foundation.test.js
      - name: Report website dependency baseline
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
