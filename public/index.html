<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Klavierhaus">
  <title>Klavierhaus System</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link id="appFavicon" rel="icon" href="/icons/icon-192.png">
  <link id="appTouchIcon" rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <main id="loginScreen" class="login-screen">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <img id="loginBrandLogo" src="/icons/icon-192.png" alt="">
        <div>
          <span class="eyebrow">KLAVIERHAUS · NEW YORK</span>
          <h1 id="loginTitle">System</h1>
        </div>
      </div>
      <p class="login-copy" data-i18n="login_copy">Sign in to the Klavierhaus internal workspace.</p>

      <form id="loginForm" class="stack-form" autocomplete="on">
        <label>
          <span data-i18n="email">Email</span>
          <input name="email" type="email" autocomplete="username" required autofocus>
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit" data-i18n="sign_in">Sign in</button>
      </form>

      <form id="activationForm" class="stack-form hidden" autocomplete="one-time-code">
        <div>
          <span class="eyebrow" data-i18n="account_activation">ACCOUNT ACTIVATION</span>
          <h2 data-i18n="confirm_login">Confirm your login</h2>
          <p id="activationHint" class="muted"></p>
        </div>
        <label>
          <span data-i18n="six_digit_code">6-digit code</span>
          <input id="activationCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </label>
        <button class="primary-button" type="submit" data-i18n="activate">Activate</button>
        <button id="resendActivationBtn" class="text-button" type="button" data-i18n="resend_code">Send a new code</button>
        <button id="backToLoginBtn" class="text-button" type="button" data-i18n="back_to_login">Back to login</button>
      </form>
    </section>
  </main>

  <div id="appShell" class="app-shell hidden">
    <aside id="appSidebar" class="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-brand-row">
        <a class="app-brand sidebar-brand" href="#workshop" data-nav="workshop" aria-label="Klavierhaus System">
          <img id="headerBrandLogo" src="/icons/icon-192.png" alt="">
          <span><strong>Klavierhaus</strong><small>System</small></span>
        </a>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse navigation">‹</button>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item" data-nav="workshop"><span class="nav-icon">▦</span><span data-i18n="nav_workshop">Workshop &amp; Calendar</span></button>
        <button type="button" class="nav-item" data-nav="intake"><span class="nav-icon">✓</span><span data-i18n="nav_intake">Intake</span></button>
        <button type="button" class="nav-item" data-nav="messenger"><span class="nav-icon">✦</span><span data-i18n="nav_messenger">Messenger</span></button>
        <button type="button" class="nav-item" data-nav="planned"><span class="nav-icon">◷</span><span data-i18n="nav_planned">Planned Jobs</span></button>
        <button type="button" class="nav-item" data-nav="master"><span class="nav-icon">◫</span><span data-i18n="nav_master">Master Data</span></button>
        <button type="button" class="nav-item" data-nav="finance"><span class="nav-icon">$</span><span data-i18n="nav_finance">Finance</span></button>
        <button type="button" class="nav-item" data-nav="documents"><span class="nav-icon">▤</span><span data-i18n="nav_documents">Documents</span></button>
        <button type="button" class="nav-item" data-nav="cms"><span class="nav-icon">◎</span><span data-i18n="nav_cms">Website CMS</span></button>
      </nav>
      <div class="sidebar-footer"><small>KLAVIERHAUS · NEW YORK</small></div>
    </aside>

    <div class="app-main-column">
      <header class="app-header">
        <button id="mobileBrandButton" class="mobile-brand-button" type="button" data-nav="workshop" aria-label="Klavierhaus System">
          <img id="mobileBrandLogo" src="/icons/icon-192.png" alt="">
        </button>
        <div class="header-welcome" id="headerWelcome" aria-live="polite"></div>
        <div class="header-tools">
          <div class="ny-clock" aria-live="off">
            <span data-i18n="new_york_time">New York time</span>
            <strong id="newYorkClock">--:--</strong>
            <small id="newYorkDate">---</small>
          </div>
          <button id="notificationBell" class="notification-bell" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notificationDrawer">
            <span class="notification-bell-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span id="notificationBadge" class="notification-badge" hidden>0</span>
          </button>
          <button id="themeToggle" class="theme-switch" type="button" aria-label="Theme">
            <span aria-hidden="true">☀</span><i></i><span aria-hidden="true">☾</span>
          </button>
          <div class="header-actions profile-menu-shell">
            <button id="languageToggle" class="language-toggle" type="button" aria-label="Language">HU</button>
            <button id="profileButton" class="profile-button" type="button" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"><span id="profileInitials">KH</span><img id="profileAvatarImage" alt="" hidden></button>
            <div id="profileMenu" class="profile-menu" role="menu" hidden>
              <div class="profile-menu-identity"><span id="profileMenuAvatar" class="profile-menu-avatar">KH</span><span><strong id="profileMenuName"></strong><small id="profileMenuRole"></small></span></div>
              <button type="button" role="menuitem" data-profile-menu="profile">Profile</button>
              <button type="button" role="menuitem" data-profile-menu="settings">Settings</button>
              <div class="profile-menu-separator"></div>
              <button type="button" role="menuitem" class="profile-menu-logout" data-profile-menu="logout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <main id="workspace" class="workspace" tabindex="-1"></main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button type="button" data-nav="workshop"><span>▦</span><small data-i18n="mobile_workshop">Workshop</small></button>
      <button type="button" data-nav="messenger"><span>✦</span><small data-i18n="mobile_messenger">Messenger</small></button>
      <button type="button" class="mobile-intake-primary" data-nav="intake"><span>＋</span><small data-i18n="mobile_intake">Intake</small></button>
      <button type="button" data-nav="master"><span>◫</span><small data-i18n="mobile_master">Master</small></button>
      <button type="button" id="mobileMoreButton" aria-haspopup="menu" aria-expanded="false"><span>•••</span><small data-i18n="mobile_more">More</small></button>
    </nav>
    <div id="mobileMorePopover" class="mobile-more-popover" hidden>
      <div class="mobile-more-popover-head"><strong data-i18n="mobile_more">More</strong><button id="mobileMoreClose" class="icon-button" type="button" aria-label="Close">×</button></div>
      <div id="mobileMoreGrid" class="mobile-more-grid"></div>
    </div>
  </div>

  <div id="notificationLayer" class="notification-layer" hidden aria-hidden="true">
    <div id="notificationBackdrop" class="notification-backdrop" aria-hidden="true"></div>
    <aside id="notificationDrawer" class="notification-drawer" aria-hidden="true" aria-labelledby="notificationDrawerTitle" tabindex="-1">
      <header class="notification-drawer-header">
        <div><span class="eyebrow">KLAVIERHAUS</span><h2 id="notificationDrawerTitle">Notifications</h2></div>
        <button id="notificationDrawerClose" class="icon-button" type="button" aria-label="Close">×</button>
      </header>
      <div class="notification-drawer-controls">
        <label class="notification-sound-toggle"><input id="notificationSoundToggle" type="checkbox" checked><span>♪</span><strong id="notificationSoundLabel">Sound</strong></label>
        <button id="notificationSnoozeAll" class="secondary-button" type="button">3h</button>
      </div>
      <div id="notificationList" class="notification-list" aria-live="polite"></div>
    </aside>
  </div>

  <dialog id="appDialog" class="app-dialog">
    <div class="dialog-card" id="dialogCard">
      <header class="dialog-header">
        <div>
          <span id="dialogEyebrow" class="eyebrow"></span>
          <h2 id="dialogTitle"></h2>
        </div>
        <button class="icon-button dialog-close-button" data-dialog-close type="button" aria-label="Close">×</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
    </div>
  </dialog>

  <script src="/app.js"></script>
  <script src="/round2.js"></script>
  <script src="/round3.js"></script>
  <script src="/messenger.js"></script>
  <script src="/v6.js"></script>
</body>
</html>
