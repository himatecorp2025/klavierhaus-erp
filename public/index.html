<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Klavierhaus">
  <title>Klavierhaus ERP</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <main id="loginScreen" class="login-screen">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <img id="loginBrandLogo" src="/icons/icon-192.png" alt="">
        <div>
          <span class="eyebrow">KLAVIERHAUS · NEW YORK</span>
          <h1 id="loginTitle">ERP</h1>
        </div>
      </div>
      <p class="login-copy">Jelentkezz be a Klavierhaus belső munkafelületére.</p>

      <form id="loginForm" class="stack-form" autocomplete="on">
        <label>
          <span>E-mail</span>
          <input name="email" type="email" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Jelszó</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">Bejelentkezés</button>
      </form>

      <form id="activationForm" class="stack-form hidden" autocomplete="one-time-code">
        <div>
          <span class="eyebrow">FIÓK AKTIVÁLÁS</span>
          <h2>Erősítsd meg a belépést</h2>
          <p id="activationHint" class="muted"></p>
        </div>
        <label>
          <span>6 jegyű kód</span>
          <input id="activationCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </label>
        <button class="primary-button" type="submit">Aktiválás</button>
        <button id="resendActivationBtn" class="text-button" type="button">Új kód küldése</button>
        <button id="backToLoginBtn" class="text-button" type="button">Vissza a belépéshez</button>
      </form>
    </section>
  </main>

  <div id="appShell" class="app-shell hidden">
    <header class="app-header">
      <a class="app-brand" href="#workshop" data-nav="workshop" aria-label="Klavierhaus ERP kezdőlap">
        <img id="headerBrandLogo" src="/icons/icon-192.png" alt="">
        <span><strong>Klavierhaus</strong><small>ERP · Round 2</small></span>
      </a>

      <nav class="desktop-nav" aria-label="Fő navigáció">
        <button type="button" class="nav-item" data-nav="workshop"><span>📋</span>Műhely &amp; Naptár</button>
        <button type="button" class="nav-item" data-nav="intake"><span>📥</span>Igényfelmérés</button>
        <button type="button" class="nav-item" data-nav="planned"><span>⏳</span>Tervezett munkák</button>
        <button type="button" class="nav-item" data-nav="master"><span>👥</span>Törzsadatok</button>
        <button type="button" class="nav-item is-disabled" disabled title="3. körben aktiváljuk"><span>💰</span>Pénzügy<small>3. kör</small></button>
        <button type="button" class="nav-item" data-nav="cms"><span>🌐</span>Weboldal CMS</button>
      </nav>

      <button id="profileButton" class="profile-button" type="button" data-nav="profile" aria-label="Profil és beállítások">
        <span id="profileInitials">KH</span>
      </button>
    </header>

    <main id="workspace" class="workspace" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="Mobil gyorsnavigáció">
      <button type="button" data-nav="workshop"><span>📋</span><small>Műhely</small></button>
      <button type="button" data-nav="planned"><span>⏳</span><small>Tervezett</small></button>
      <button type="button" data-nav="intake"><span>📥</span><small>Igény</small></button>
      <button type="button" data-nav="master"><span>👥</span><small>Törzs</small></button>
      <button type="button" data-nav="cms"><span>🌐</span><small>CMS</small></button>
      <button type="button" data-nav="profile"><span>👤</span><small>Profil</small></button>
    </nav>
  </div>

  <dialog id="appDialog" class="app-dialog">
    <form method="dialog" class="dialog-card" id="dialogCard">
      <header class="dialog-header">
        <div>
          <span id="dialogEyebrow" class="eyebrow"></span>
          <h2 id="dialogTitle"></h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Bezárás" type="submit">×</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
