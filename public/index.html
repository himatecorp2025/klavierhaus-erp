<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Klavierhaus">
  <title>Klavierhaus ERP</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <main id="loginScreen" class="login-screen">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <img id="loginBrandLogo" src="/icons/icon-192.png" alt="">
        <div>
          <span class="eyebrow">KLAVIERHAUS · NEW YORK</span>
          <h1 id="loginTitle">ERP</h1>
        </div>
      </div>
      <p class="login-copy" data-i18n="login_copy">Sign in to the Klavierhaus internal workspace.</p>

      <form id="loginForm" class="stack-form" autocomplete="on">
        <label>
          <span data-i18n="email">Email</span>
          <input name="email" type="email" autocomplete="username" required autofocus>
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit" data-i18n="sign_in">Sign in</button>
      </form>

      <form id="activationForm" class="stack-form hidden" autocomplete="one-time-code">
        <div>
          <span class="eyebrow" data-i18n="account_activation">ACCOUNT ACTIVATION</span>
          <h2 data-i18n="confirm_login">Confirm your login</h2>
          <p id="activationHint" class="muted"></p>
        </div>
        <label>
          <span data-i18n="six_digit_code">6-digit code</span>
          <input id="activationCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </label>
        <button class="primary-button" type="submit" data-i18n="activate">Activate</button>
        <button id="resendActivationBtn" class="text-button" type="button" data-i18n="resend_code">Send a new code</button>
        <button id="backToLoginBtn" class="text-button" type="button" data-i18n="back_to_login">Back to login</button>
      </form>
    </section>
  </main>

  <div id="appShell" class="app-shell hidden">
    <header class="app-header">
      <a class="app-brand" href="#workshop" data-nav="workshop" aria-label="Klavierhaus ERP kezdőlap">
        <img id="headerBrandLogo" src="/icons/icon-192.png" alt="">
        <span><strong>Klavierhaus</strong><small>ERP · Final</small></span>
      </a>

      <nav class="desktop-nav" aria-label="Fő navigáció">
        <button type="button" class="nav-item" data-nav="workshop"><span>📋</span><span data-i18n="nav_workshop">Workshop &amp; Calendar</span></button>
        <button type="button" class="nav-item" data-nav="intake"><span>📥</span><span data-i18n="nav_intake">Intake</span></button>
        <button type="button" class="nav-item" data-nav="planned"><span>⏳</span><span data-i18n="nav_planned">Planned Jobs</span></button>
        <button type="button" class="nav-item" data-nav="master"><span>👥</span><span data-i18n="nav_master">Master Data</span></button>
        <button type="button" class="nav-item" data-nav="finance"><span>💰</span><span data-i18n="nav_finance">Finance</span></button>
        <button type="button" class="nav-item" data-nav="cms"><span>🌐</span><span data-i18n="nav_cms">Website CMS</span></button>
      </nav>

      <div class="header-tools">
        <div class="ny-clock" aria-live="off">
          <span data-i18n="new_york_time">New York time</span>
          <strong id="newYorkClock">--:--</strong>
          <small id="newYorkDate">---</small>
        </div>
        <div class="header-actions">
          <button id="languageToggle" class="language-toggle" type="button" aria-label="Language">HU</button>
          <button id="profileButton" class="profile-button" type="button" data-nav="profile" aria-label="Profile and settings">
            <span id="profileInitials">KH</span>
          </button>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="Mobil gyorsnavigáció">
      <button type="button" data-nav="workshop"><span>📋</span><small data-i18n="mobile_workshop">Workshop</small></button>
      <button type="button" data-nav="planned"><span>⏳</span><small data-i18n="mobile_planned">Planned</small></button>
      <button type="button" data-nav="intake"><span>📥</span><small data-i18n="mobile_intake">Intake</small></button>
      <button type="button" data-nav="master"><span>👥</span><small data-i18n="mobile_master">Master</small></button>
      <button type="button" data-nav="finance"><span>💰</span><small data-i18n="mobile_finance">Finance</small></button>
      <button type="button" data-nav="cms"><span>🌐</span><small>CMS</small></button>
      <button type="button" data-nav="profile"><span>👤</span><small data-i18n="mobile_profile">Profile</small></button>
    </nav>
  </div>

  <dialog id="appDialog" class="app-dialog">
    <form method="dialog" class="dialog-card" id="dialogCard">
      <header class="dialog-header">
        <div>
          <span id="dialogEyebrow" class="eyebrow"></span>
          <h2 id="dialogTitle"></h2>
        </div>
        <button class="icon-button dialog-close-button" data-dialog-close type="button" aria-label="Close">×</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
  <script src="/round2.js"></script>
  <script src="/round3.js"></script>
</body>
</html>
